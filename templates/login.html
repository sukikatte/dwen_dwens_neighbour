    <script>
        // 动态创建粒子的函数
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 30; // 一次创建的粒子数量

            // 创建新的粒子（不清空容器，以保持持续效果）
            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => {
                    createParticle(container, i);
                }, i * 300); // 每隔300毫秒创建一个粒子
            }

            // 每10秒重新创建一批粒子
            setTimeout(createParticles, 10000);
        }

        function createParticle(container, index) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            // 随机大小 (15px - 35px)
            const size = Math.floor(Math.random() * 20) + 15;

            // 随机位置 (0% - 100% 左侧位置)
            const left = Math.floor(Math.random() * 100);

            // 随机动画持续时间 (15s - 30s)
            const duration = Math.floor(Math.random() * 15) + 15;

            // 随机透明度 (0.05 - 0.15)
            const opacity = (Math.random() * 0.1 + 0.05).toFixed(2);

            // 设置样式
            particle.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${left}%;
                top: 100%;
                animation-duration: ${duration}s;
                background-color: rgba(46, 125, 50, ${opacity});
                box-shadow: 0 0 10px rgba(46, 125, 50, ${opacity * 2});
            `;

            // 添加到容器
            container.appendChild(particle);

            // 动画结束后移除粒子元素
            particle.addEventListener('animationend', () => {
                particle.remove();
            });
        }
        

    </script>
